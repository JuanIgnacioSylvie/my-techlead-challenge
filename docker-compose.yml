services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ejecuta los scripts de db/ en orden (01 -> 02 -> 03) una vez que SQL Server está sano
  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
    command: >
      bash -c "
        for f in /db/01_schema.sql /db/02_procedures.sql /db/03_seed_data.sql; do
          echo \"Ejecutando $$f\";
          /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'YourStrong!Passw0rd' -I -i $$f -b || exit 1;
        done
      "

  backend:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_SERVER: sqlserver
      DB_USER: sa
      DB_PASSWORD: "YourStrong!Passw0rd"
      DB_NAME: GestionPedidos
      JWT_SECRET: "cambiar-en-produccion"
      JWT_EXPIRES_MINUTES: "60"
    ports:
      - "8000:8000"

volumes:
  sqlserver-data:
